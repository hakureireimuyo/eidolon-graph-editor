[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-graph-editor"
version = "0.1.0"
description = "Eidolon 可视化图编辑器:内嵌 eidolon-graph 内核(headless 预览 + 编辑事务),后续由 eidolon-studio 引用整合"
requires-python = ">=3.11"
# eidolon-graph(内核)以 git 源(pin rev)安装为正规第三方依赖,
# 由下方 [tool.uv.sources] 声明;monorepo 检出与独立 clone 一致,无路径耦合。
# 校验 / 编辑操作 / 预览全部复用内核,本仓库不重实现图语义。
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "eidolon-graph",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["backend"]

[tool.uv.sources]
eidolon-graph = { git = "ssh://git@github.com/hakureireimuyo/eidolon-graph.git", rev = "846ef0630485d8b50297116b8d05d97fff01ff58" }
